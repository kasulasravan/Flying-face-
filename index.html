<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6a56d">
<title>Flying Face — Mini Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7b27d}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;touch-action: manipulation;background:linear-gradient(180deg,#75a8e7 0%,#a7bce7 37%,#f6b18c 68%,#f9d1a0 100%)}
.sun{position:absolute;width:34vw;height:34vw;max-width:210px;max-height:210px;border-radius:50%;background:radial-gradient(circle,#ffe5a5 0 45%,#ffd28b 68%,transparent 70%);right:7%;top:28%;opacity:.9}
.cloud{position:absolute;background:#ffd2b0;filter:blur(16px);opacity:.65;border-radius:50%;width:38vw;height:7vw;top:35%;left:-5%;transform:rotate(-9deg)}
.cloud.c2{top:48%;left:60%;width:45vw;opacity:.55}
.hills{position:absolute;bottom:17%;width:100%;height:24%;background:linear-gradient(160deg,transparent 0 15%,#8e9b9a 15% 28%,transparent 28%),linear-gradient(20deg,transparent 0 22%,#9ca6a0 22% 39%,transparent 39%);opacity:.5}
.buildings{position:absolute;bottom:0;width:100%;height:28%;background:linear-gradient(90deg,#d6a17b 0 16%,transparent 16% 21%,#d89b7c 21% 36%,transparent 36% 64%,#d7a28a 64% 82%,transparent 82%);opacity:.75}
.buildings:after{content:"";position:absolute;inset:12% 0 0;background:repeating-linear-gradient(90deg,transparent 0 5%,#fff0cf 5.2% 5.8%,transparent 6% 10%),repeating-linear-gradient(0deg,transparent 0 24px,#fff0cf 25px 28px)}
.tree{position:absolute;bottom:14%;left:-5%;width:30vw;height:35vw;border-radius:50%;background:radial-gradient(ellipse at 50% 55%,#557e55 0 40%,transparent 70%);opacity:.8}
.tree.right{left:auto;right:-10%;bottom:17%;width:40vw;height:45vw}
.score{position:absolute;z-index:8;top:22px;left:0;right:0;text-align:center;font-size:58px;line-height:1;font-weight:900;color:white;-webkit-text-stroke:2px #27364a;text-shadow:0 3px 0 #27364a,0 5px 12px #0005}
.player{position:absolute;z-index:5;width:76px;height:76px;border-radius:50%;object-fit:cover;border:4px solid #fff9;box-shadow:0 5px 14px #26334c55;left:24%;top:45%;transform:translate(-50%,-50%);will-change:top}
.pipe{position:absolute;z-index:4;width:82px;display:flex;flex-direction:column;align-items:stretch;gap:3px;left:110%;will-change:left}
.pipe.top{top:0}.pipe.bottom{bottom:0}
.book{height:35px;border:3px solid #554b43;border-radius:5px 8px 5px 5px;box-shadow:inset 0 5px 0 #ffffff55,0 2px 3px #0003;background:#a34d5b;position:relative}
.book:nth-child(3n){background:#e2c99a}.book:nth-child(3n+1){background:#276b70}.book:nth-child(3n+2){background:#b85f50}
.book:after{content:"";position:absolute;left:7px;right:7px;top:7px;height:3px;background:#f4e7c9aa}
.panel{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#26344a33}
.card{width:min(88%,360px);padding:25px 22px;border-radius:22px;text-align:center;background:#fff8ed;box-shadow:0 18px 55px #24344a44;border:1px solid #fff}
h1{font-size:30px;margin:0 0 8px;color:#26364a}.sub{color:#536174;margin:0 0 20px;line-height:1.45}
button{border:0;border-radius:999px;background:#263e5c;color:white;font-size:17px;font-weight:750;padding:13px 27px;box-shadow:0 4px 0 #17283d;cursor:pointer}
.hint{position:absolute;z-index:7;bottom:18px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 5px #24344a;font-weight:700;font-size:13px;letter-spacing:.3px}
.hidden{display:none!important}
@media(min-width:700px){.player{width:88px;height:88px}.pipe{width:96px}.book{height:40px}.score{font-size:66px}}
</style>
</head>

const H=()=>game.clientHeight, W=()=>game.clientWidth;
function books(el){el.innerHTML=''; for(let i=0;i<7;i++){let b=document.createElement('div');b.className='book';el.appendChild(b)}}
function reset(){cancelAnimationFrame(raf);pipes=[];topPipe.style.left='110%';bottomPipe.style.left='110%';score=0;scoreEl.textContent='0';y=H()*.45;vy=0;spawn=0;last=0;player.style.top=y+'px';}
function flap(){if(!running)return;vy=-390}
function start(){reset();panel.classList.add('hidden');hint.classList.remove('hidden');running=true;last=performance.now();raf=requestAnimationFrame(loop);flap()}
function end(){running=false;panel.classList.remove('hidden');hint.classList.add('hidden');panel.querySelector('h1').textContent='Game Over';panel.querySelector('.sub').textContent='Your score: '+score+'. Try again and beat your best!';document.getElementById('start').textContent='Play Again'}
function makePipe(){let gap=Math.max(158,Math.min(205,H()*.25));let center=H()*.34+Math.random()*H()*.34;let topH=center-gap/2, bottomH=H()-(center+gap/2);
let t=document.createElement('div'),b=document.createElement('div');t.className='pipe top';b.className='pipe bottom';books(t);books(b);
t.style.height=topH+'px';b.style.height=bottomH+'px';t.style.left=W()+'px';b.style.left=W()+'px';game.append(t,b);pipes.push({x:W(),t,b,passed:false,gapTop:topH,gapBottom:topH+gap});}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;vy+=1050*dt;y+=vy*dt;
if(y<28||y>H()-30){end();return}player.style.top=y+'px';spawn+=dt;if(spawn>1.65){spawn=0;makePipe()}
const px=W()*.24, pw=player.offsetWidth*.72, ph=player.offsetHeight*.72;
for(let p of pipes){p.x-=190*dt;p.t.style.left=p.x+'px';p.b.style.left=p.x+'px';
let overlap=px+pw/2>p.x+5&&px-pw/2<p.x+82-5;
if(overlap&&(y-ph/2<p.gapTop||y+ph/2>p.gapBottom)){end();return}
if(!p.passed&&p.x+82<px){p.passed=true;score++;scoreEl.textContent=score}
}
pipes=pipes.filter(p=>{if(p.x<-100){p.t.remove();p.b.remove();return false}return true});
raf=requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',start);
game.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(!running){if(panel.classList.contains('hidden')===false)return;}else flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!running){if(!panel.classList.contains('hidden'))start()}else flap()}});
addEventListener('resize',()=>{if(!running)y=Math.min(H()-35,Math.max(35,y));player.style.top=y+'px'});
books(topPipe);books(bottomPipe);
</script>
</body></html>
